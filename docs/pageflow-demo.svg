<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PageFlow maps every page and navigation path</title>
  <desc id="desc">An animated flow map discovers application pages, draws navigation paths, highlights a link, and updates after a route change.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d8cec3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#332b25" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#746b64"/>
    </marker>
    <clipPath id="browserClip">
      <rect x="0" y="0" width="226" height="138" rx="12"/>
    </clipPath>
    <style>
      :root { color-scheme: light dark; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .route { fill: none; stroke: #746b64; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); stroke-dasharray: 1; stroke-dashoffset: 1; }
      .card { filter: url(#shadow); opacity: 0; transform-box: fill-box; transform-origin: center; }
      .card-home { animation: cardIn 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .card-explore { animation: cardIn 12s .65s cubic-bezier(.2,.8,.2,1) infinite; }
      .card-detail { animation: cardIn 12s 1.3s cubic-bezier(.2,.8,.2,1) infinite; }
      .card-login { animation: cardIn 12s 1.95s cubic-bezier(.2,.8,.2,1) infinite; }
      .card-checkout { animation: cardLate 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .route-1 { animation: draw 12s 2.1s ease-in-out infinite; }
      .route-2 { animation: draw 12s 2.55s ease-in-out infinite; }
      .route-3 { animation: draw 12s 3s ease-in-out infinite; }
      .route-4 { animation: drawLate 12s ease-in-out infinite; }
      .hotspot { opacity: 0; animation: hotspot 12s ease-in-out infinite; }
      .cursor { opacity: 0; animation: cursor 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .scan { opacity: 0; animation: scan 12s ease-in-out infinite; }
      .hmr { opacity: 0; transform-box: fill-box; transform-origin: center; animation: hmr 12s ease-in-out infinite; }
      .viewport { transform-origin: 600px 340px; animation: viewport 12s cubic-bezier(.4,0,.2,1) infinite; }
      .status-dot { animation: blink 1.8s ease-in-out infinite; }

      @keyframes cardIn {
        0%, 5% { opacity: 0; transform: translateY(18px) scale(.94); }
        11%, 91% { opacity: 1; transform: translateY(0) scale(1); }
        98%, 100% { opacity: 0; transform: translateY(-7px) scale(.98); }
      }
      @keyframes cardLate {
        0%, 58% { opacity: 0; transform: translateY(18px) scale(.92); }
        65%, 91% { opacity: 1; transform: translateY(0) scale(1); }
        98%, 100% { opacity: 0; transform: translateY(-7px) scale(.98); }
      }
      @keyframes draw {
        0%, 8% { stroke-dashoffset: 1; }
        15%, 76% { stroke-dashoffset: 0; }
        84%, 100% { stroke-dashoffset: 1; }
      }
      @keyframes drawLate {
        0%, 62% { stroke-dashoffset: 1; }
        69%, 91% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 1; }
      }
      @keyframes hotspot {
        0%, 32%, 48%, 100% { opacity: 0; }
        36%, 44% { opacity: 1; }
      }
      @keyframes cursor {
        0%, 29%, 49%, 100% { opacity: 0; transform: translate(438px, 213px); }
        33% { opacity: 1; transform: translate(490px, 248px); }
        43% { opacity: 1; transform: translate(516px, 270px); }
        46% { opacity: 0; transform: translate(516px, 270px); }
      }
      @keyframes scan {
        0%, 10%, 28%, 100% { opacity: 0; transform: translateX(-205px); }
        13% { opacity: .55; }
        25% { opacity: 0; transform: translateX(205px); }
      }
      @keyframes hmr {
        0%, 51%, 70%, 100% { opacity: 0; transform: scale(.78); }
        55%, 65% { opacity: 1; transform: scale(1); }
      }
      @keyframes viewport {
        0%, 72% { transform: translate(0, 0) scale(1); }
        82%, 91% { transform: translate(22px, 4px) scale(.88); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes blink { 50% { opacity: .35; } }

      @media (prefers-color-scheme: dark) {
        .surface { fill: #161412; }
        .panel { fill: #201d1a; stroke: #3e3732; }
        .grid-dot { opacity: .2; }
        .ink { fill: #f6f0e8; }
        .muted { fill: #aaa097; }
        .chrome { fill: #28231f; }
        .chrome-line { stroke: #413a34; }
        .route { stroke: #a69c94; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .card, .card-checkout, .hmr { opacity: 1; transform: none; }
        .route { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect class="surface" width="1200" height="675" rx="22" fill="#f7f3ee"/>
  <rect class="grid-dot" x="238" y="72" width="962" height="555" fill="url(#grid)"/>

  <g class="sans">
    <rect class="chrome" width="1200" height="72" rx="22" fill="#fbf8f4"/>
    <path class="chrome-line" d="M0 72H1200" stroke="#ddd4ca"/>
    <path d="M32 35l5-5 5 5-5 5z" fill="#ff755f"/>
    <text class="ink" x="52" y="42" fill="#211d1a" font-size="18" font-weight="750">unplugin-pageflow</text>
    <text class="muted mono" x="251" y="41" fill="#8c8178" font-size="12">Storefront flow</text>
    <text class="muted mono" x="364" y="41" fill="#b0a69e" font-size="12">/</text>
    <text class="muted mono" x="388" y="41" fill="#8c8178" font-size="12">5 pages</text>
    <rect x="1094" y="24" width="72" height="26" rx="13" fill="none" stroke="#ff8875"/>
    <text x="1130" y="41" fill="#e95f4b" font-size="9" text-anchor="middle" letter-spacing="1.4">DEV ONLY</text>

    <g transform="translate(28 108)">
      <text class="muted mono" fill="#a1968e" font-size="10" letter-spacing="2">FLOW MAP</text>
      <text class="ink" y="43" fill="#211d1a" font-size="27" font-weight="780">See every page.</text>
      <text y="76" fill="#ff755f" font-family="Georgia, serif" font-size="30" font-style="italic">Know every path.</text>
      <text class="muted" y="113" fill="#746b64" font-size="12">Routes, real previews, and</text>
      <text class="muted" y="132" fill="#746b64" font-size="12">navigation on one canvas.</text>
      <g transform="translate(0 169)">
        <circle class="status-dot" cx="4" cy="4" r="4" fill="#2bb99d"/>
        <text class="muted mono" x="17" y="8" fill="#746b64" font-size="10">Live route discovery</text>
      </g>
      <path d="M0 205H180" stroke="#ddd4ca"/>
      <text x="0" y="231" fill="#ff755f" font-size="9" font-weight="700">TIP</text>
      <text class="muted mono" x="0" y="250" fill="#8c8178" font-size="9">Scroll to zoom. Drag to explore.</text>
    </g>
  </g>

  <g class="viewport">
    <g transform="translate(0 -4)">
      <path class="route route-1" pathLength="1" d="M480 254 C520 254 521 254 560 254"/>
      <path class="route route-2" pathLength="1" d="M786 254 C830 254 831 254 872 254"/>
      <path class="route route-3" pathLength="1" d="M672 324 C672 366 609 374 609 419"/>
      <path class="route route-4" pathLength="1" d="M1098 324 C1098 372 1004 379 1004 419"/>

      <g class="card card-home" transform="translate(274 184)">
        <rect width="206" height="140" rx="13" fill="#ff755f"/>
        <g clip-path="url(#browserClip)">
          <rect width="206" height="24" fill="#eb6652" opacity=".55"/>
          <circle cx="15" cy="12" r="3" fill="#fff" opacity=".62"/><circle cx="26" cy="12" r="3" fill="#fff" opacity=".38"/>
          <rect x="16" y="43" width="88" height="9" rx="4.5" fill="#fff" opacity=".95"/>
          <rect x="16" y="61" width="132" height="6" rx="3" fill="#fff" opacity=".48"/>
          <rect x="16" y="83" width="56" height="27" rx="7" fill="#2b2420" opacity=".86"/>
          <rect x="117" y="39" width="72" height="78" rx="9" fill="#ffd8cc" opacity=".58"/>
        </g>
        <text x="14" y="130" fill="#fff" font-size="10" font-weight="700" class="sans">HOME · /</text>
        <rect class="scan" x="0" y="24" width="48" height="102" fill="#fff" opacity=".22"/>
      </g>

      <g class="card card-explore" transform="translate(560 184)">
        <rect width="226" height="140" rx="13" fill="#7764f6"/>
        <rect width="226" height="24" rx="13" fill="#6654df" opacity=".55"/>
        <circle cx="15" cy="12" r="3" fill="#fff" opacity=".62"/><circle cx="26" cy="12" r="3" fill="#fff" opacity=".38"/>
        <rect x="16" y="42" width="194" height="23" rx="8" fill="#fff" opacity=".2"/>
        <rect x="16" y="74" width="57" height="40" rx="7" fill="#fff" opacity=".82"/>
        <rect x="84" y="74" width="57" height="40" rx="7" fill="#fff" opacity=".5"/>
        <rect x="152" y="74" width="58" height="40" rx="7" fill="#fff" opacity=".3"/>
        <text x="14" y="130" fill="#fff" font-size="10" font-weight="700" class="sans">EXPLORE · /explore</text>
        <rect class="hotspot" x="79" y="69" width="67" height="50" rx="10" fill="none" stroke="#fff" stroke-width="3"/>
      </g>

      <g class="card card-detail" transform="translate(872 184)">
        <rect width="226" height="140" rx="13" fill="#29b79c"/>
        <rect width="226" height="24" rx="13" fill="#169e86" opacity=".55"/>
        <circle cx="15" cy="12" r="3" fill="#fff" opacity=".62"/><circle cx="26" cy="12" r="3" fill="#fff" opacity=".38"/>
        <rect x="16" y="40" width="76" height="72" rx="8" fill="#d6fff4" opacity=".62"/>
        <rect x="105" y="42" width="88" height="9" rx="4.5" fill="#fff" opacity=".92"/>
        <rect x="105" y="60" width="104" height="6" rx="3" fill="#fff" opacity=".42"/>
        <rect x="105" y="76" width="73" height="6" rx="3" fill="#fff" opacity=".42"/>
        <rect x="105" y="94" width="58" height="22" rx="6" fill="#fff" opacity=".88"/>
        <text x="14" y="130" fill="#fff" font-size="10" font-weight="700" class="sans">DETAIL · /detail/:id</text>
      </g>

      <g class="card card-login" transform="translate(496 419)">
        <rect width="226" height="140" rx="13" fill="#ecad3c"/>
        <rect width="226" height="24" rx="13" fill="#d99828" opacity=".5"/>
        <circle cx="15" cy="12" r="3" fill="#fff" opacity=".62"/><circle cx="26" cy="12" r="3" fill="#fff" opacity=".38"/>
        <rect x="44" y="43" width="138" height="16" rx="6" fill="#fff" opacity=".75"/>
        <rect x="44" y="68" width="138" height="16" rx="6" fill="#fff" opacity=".5"/>
        <rect x="73" y="94" width="80" height="22" rx="7" fill="#312720" opacity=".82"/>
        <text x="14" y="130" fill="#fff" font-size="10" font-weight="700" class="sans">SIGN IN · /login</text>
      </g>

      <g class="card card-checkout" transform="translate(891 419)">
        <rect width="226" height="140" rx="13" fill="#d85b89"/>
        <rect width="226" height="24" rx="13" fill="#c44d79" opacity=".52"/>
        <circle cx="15" cy="12" r="3" fill="#fff" opacity=".62"/><circle cx="26" cy="12" r="3" fill="#fff" opacity=".38"/>
        <rect x="18" y="42" width="118" height="12" rx="5" fill="#fff" opacity=".8"/>
        <rect x="18" y="65" width="84" height="7" rx="3.5" fill="#fff" opacity=".42"/>
        <rect x="18" y="82" width="190" height="1" fill="#fff" opacity=".3"/>
        <rect x="128" y="95" width="80" height="21" rx="6" fill="#fff" opacity=".88"/>
        <text x="14" y="130" fill="#fff" font-size="10" font-weight="700" class="sans">CHECKOUT · /checkout</text>
      </g>
    </g>

    <g class="hmr sans" transform="translate(935 367)">
      <circle cx="0" cy="0" r="34" fill="#ff755f" opacity=".12" filter="url(#soft)"/>
      <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#211d1a"/>
      <circle cx="-29" cy="0" r="4" fill="#35c6a8"/>
      <text x="-18" y="4" fill="#fff" font-size="10" font-weight="700">HMR · route added</text>
    </g>

    <g class="cursor">
      <path d="M0 0v24l7-6 5 10 5-3-5-9h9z" fill="#201c19" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <g class="sans">
    <rect class="chrome" x="0" y="627" width="1200" height="48" rx="0" fill="#fbf8f4"/>
    <path class="chrome-line" d="M0 627H1200" stroke="#ddd4ca"/>
    <circle cx="32" cy="651" r="4" fill="#2bb99d"/>
    <text class="muted mono" x="45" y="655" fill="#8c8178" font-size="9">Live previews connected</text>
    <text class="muted mono" x="1040" y="655" fill="#8c8178" font-size="9">Updated just now</text>
  </g>
</svg>
