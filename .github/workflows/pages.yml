name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - packages/chrome-extension/**
      - packages/pageflow-core/**
      - packages/pageflow-runtime/**
      - packages/pageflow-ui/**
      - scripts/generate-chrome-update.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Build signed Chrome extension
        env:
          CHROME_EXTENSION_KEY_BASE64: ${{ secrets.CHROME_EXTENSION_KEY_BASE64 }}
        run: |
          test -n "$CHROME_EXTENSION_KEY_BASE64" || { echo "Missing CHROME_EXTENSION_KEY_BASE64 secret"; exit 1; }
          printf '%s' "$CHROME_EXTENSION_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/pageflow.pem"
          pnpm build:chrome
          google-chrome --pack-extension="$GITHUB_WORKSPACE/packages/chrome-extension/.output/chrome-mv3" --pack-extension-key="$RUNNER_TEMP/pageflow.pem"
          mkdir -p docs/public/chrome
          version="$(node -p "require('./packages/chrome-extension/.output/chrome-mv3/manifest.json').version")"
          mv packages/chrome-extension/.output/chrome-mv3.crx "docs/public/chrome/pageflow-v${version}.crx"
          cp "docs/public/chrome/pageflow-v${version}.crx" docs/public/chrome/pageflow.crx
          node scripts/generate-chrome-update.mjs "$RUNNER_TEMP/pageflow.pem" packages/chrome-extension/.output/chrome-mv3/manifest.json docs/public/chrome/updates.xml
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe deployed Chrome distribution
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/chrome/pageflow.crx" --output "$RUNNER_TEMP/pageflow.crx"
          test "$(wc -c < "$RUNNER_TEMP/pageflow.crx")" -gt 100000
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/chrome/updates.xml" --output "$RUNNER_TEMP/updates.xml"
          grep -q '<updatecheck ' "$RUNNER_TEMP/updates.xml"
          grep -q 'pageflow-v[0-9].*\.crx' "$RUNNER_TEMP/updates.xml"
