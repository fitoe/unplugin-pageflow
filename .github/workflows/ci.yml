name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run cross-platform smoke suite
        run: pnpm test:smoke
      - name: Verify distributable outputs
        run: pnpm build:demo && pnpm check:package && pnpm build:playground && pnpm check:production && pnpm pack:check
