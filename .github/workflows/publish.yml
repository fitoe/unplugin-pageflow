name: Publish to npm

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run check

      - name: Install release tooling
        run: npm install --prefix "$RUNNER_TEMP/semantic-release" --no-package-lock --no-save semantic-release@25.0.8 @semantic-release/npm@13.1.5

      - name: Release
        run: "$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
